name: v2 refactor checks

on:
  push:
    branches: [feature/v2]
  pull_request:
    branches: [feature/v2, main]

jobs:
  changesets:
    name: Changesets present on public-API PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps
        run: yarn install --ignore-scripts
      - name: Changeset status (warn-only on docs/infra PRs)
        run: yarn changeset status --since=origin/${{ github.base_ref }} || true

  migration-gate:
    name: G2 - migration manifest gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run migration gate
        run: node scripts/check-migration-gate.js --base=origin/${{ github.base_ref }}

  publish-dry-run:
    name: npm publish --dry-run (both libs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps
        run: yarn install --ignore-scripts
      - name: Build libraries
        run: yarn build
      - name: al-web-components publish dry-run
        run: cd libs/al-web-components && npm publish --dry-run
      - name: al-react publish dry-run
        run: cd libs/al-react && npm publish --dry-run

  baselines-required:
    name: G8 - baselines updated on build/dep change
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run baseline gate
        run: node scripts/check-baselines-gate.js --base=origin/${{ github.base_ref }}
