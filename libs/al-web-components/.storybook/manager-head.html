<!--
  Altitude — Storybook manager reskin.

  WHY THIS FILE EXISTS
  Storybook's ThemeVars contract exposes 31 keys and none of them are sidebar
  variables, so the structural half of the reskin (geometry, section headers,
  count badges, indentation, the dock) has to be CSS.

  SELECTOR POLICY — read before editing
  Storybook 10.4.5 styles the manager with Emotion (cache key "css"), so class
  names look like `css-1a2b3c` and change on any patch release. NEVER target
  those. Only these are hand-written literals in the Storybook source and
  therefore safe:

    #storybook-sidebar-region      #storybook-explorer-menu
    #storybook-explorer-tree       #storybook-explorer-searchfield
    #storybook-explorer-tree-heading
    .sidebar-container  .sidebar-header  .sidebar-item  .sidebar-subheading
    .sb-bar  .sb-sr-only
    data-item-id  data-ref-id  data-parent-id  data-selected  data-highlightable
    data-nodetype="root|group|component|story|document"

  SPECIFICITY NOTE
  This file is injected into <head> BEFORE Storybook's Emotion <style> tags, so
  at equal specificity Storybook wins. Every rule below is therefore anchored to
  an id (or uses an explicit escape hatch) to outrank `.css-hash`.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>

<style id="al-manager-reskin">
  :root {
    /* Surfaces */
    --al-sb-page: #17171a;
    --al-sb-panel: #1c1c1f;
    --al-sb-canvas: #141416;
    --al-sb-control: #232327;
    --al-sb-active: #232327;
    --al-sb-active-child: #2a2a30;
    --al-sb-popover: #1f1f23;

    /* Lines */
    --al-sb-border: #262629;
    --al-sb-border-soft: #212125;
    --al-sb-border-control: #2c2c31;
    --al-sb-border-strong: #34343a;

    /* Ink */
    --al-sb-text: #e8e8ea;
    --al-sb-text-strong: #ededf0;
    --al-sb-text-idle: #b6b6be;
    --al-sb-text-muted: #8a8a92;
    --al-sb-text-secondary: #9a9aa3;

    /* Accent */
    --al-sb-accent: #4375ff;
    --al-sb-accent-deep: #2d56ca;
    --al-sb-ok: #3ee48c;

    /* Type */
    --al-sb-font: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    --al-sb-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    /* Geometry — mirrors the reference prototype */
    --al-sb-nav-width: 272px;
    --al-sb-row-radius: 5px;
    --al-sb-indent-root: 8px;
    --al-sb-indent-component: 18px;
    --al-sb-indent-story: 32px;
  }

  /* ---------------------------------------------------------------------
     1. Shell
     --------------------------------------------------------------------- */

  body,
  .sb-show-main {
    font-family: var(--al-sb-font);
    background: var(--al-sb-page);
  }

  /* Storybook writes the nav width as an inline CSS var on the layout grid,
     so we set the var rather than fighting the grid template. */
  #root > div,
  .sb-show-main > div {
    --nav-width: var(--al-sb-nav-width);
  }

  /* ---------------------------------------------------------------------
     2. Sidebar shell
     --------------------------------------------------------------------- */

  /* CAREFUL: `#storybook-sidebar-region` and `.sidebar-container` are the SAME
     element (class="container sidebar-container", id="storybook-sidebar-region"),
     not parent and child. A descendant selector between them matches nothing. */
  #storybook-sidebar-region,
  #storybook-sidebar-region.sidebar-container {
    background: var(--al-sb-panel);
    border-right: 1px solid var(--al-sb-border);
  }

  /* Brand block — logo lockup at the top.
     `.sidebar-header` is a flex row, so the version pseudo-element below would
     become a sibling flex item and sit *beside* the logo. Forcing a wrap and
     giving it 100% width puts it on its own line underneath. */
  #storybook-sidebar-region .sidebar-header {
    padding: 16px 16px 12px;
    border-bottom: none;
    flex-wrap: wrap;
    row-gap: 2px;
  }

  #storybook-sidebar-region .sidebar-header img {
    max-height: 20px;
    width: auto;
  }

  /* The Settings button is a real control (about / shortcuts / release notes),
     so it is kept and re-anchored to the top-right rather than removed. */
  #storybook-sidebar-region .sidebar-header button[aria-label='Settings'] {
    position: absolute;
    top: 14px;
    right: 14px;
    color: var(--al-sb-text-muted);
  }

  #storybook-sidebar-region .sidebar-header {
    position: relative;
  }

  /* Version + build badge. Purely decorative, so a pseudo-element is the right
     tool — no DOM to own, nothing to keep in sync. */
  #storybook-sidebar-region .sidebar-header::after {
    content: 'v3.0.0-next · SB 10';
    flex: 0 0 100%;
    width: 100%;
    font-family: var(--al-sb-mono);
    font-size: 11px;
    line-height: 1.4;
    color: var(--al-sb-text-muted);
    letter-spacing: 0.01em;
  }

  /* ---------------------------------------------------------------------
     3. Search field
     --------------------------------------------------------------------- */

  #storybook-explorer-searchfield {
    height: 32px;
    padding: 0 10px 0 30px;
    border-radius: 6px;
    background: var(--al-sb-control);
    border: 1px solid var(--al-sb-border-control);
    color: var(--al-sb-text-strong);
    font-family: var(--al-sb-font);
    font-size: 12px;
  }

  #storybook-explorer-searchfield::placeholder {
    color: var(--al-sb-text-secondary);
  }

  #storybook-explorer-searchfield:focus,
  #storybook-explorer-searchfield:focus-visible {
    border-color: var(--al-sb-accent);
    outline: none;
    box-shadow: none;
  }

  /* ---------------------------------------------------------------------
     4. Tree — shared row shape
     --------------------------------------------------------------------- */

  #storybook-explorer-tree {
    padding: 0 8px;
  }

  #storybook-explorer-tree .sidebar-item {
    font-family: var(--al-sb-font);
    border-radius: var(--al-sb-row-radius);
    padding-top: 6px;
    padding-bottom: 6px;
    transition: background 0.12s ease, color 0.12s ease;
  }

  /* Storybook renders its own chevrons/icons per node. The prototype has none,
     so they are hidden rather than restyled. */
  #storybook-explorer-tree .sidebar-item svg {
    display: none;
  }

  /* --- Section headers: `data-nodetype="root"` -------------------------
     Root rows carry `.sidebar-subheading`, NOT `.sidebar-item`, so they need
     their own selector — including for the chevron reset below. */

  #storybook-explorer-tree .sidebar-subheading {
    padding-left: var(--al-sb-indent-root);
    margin-top: 14px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--al-sb-text-muted);
    background: transparent;
  }

  /* The reference design has no disclosure chevrons or expand-all control on
     section headers. The buttons stay in the DOM (and keyboard-reachable) —
     only the glyphs are hidden. */
  #storybook-explorer-tree .sidebar-subheading svg {
    display: none;
  }

  #storybook-explorer-tree .sidebar-subheading button[data-action='collapse-root'] {
    padding-left: 0;
  }

  /* The per-section expand/collapse-all control on the right. */
  #storybook-explorer-tree .sidebar-subheading > button:last-child:not([data-action]) {
    opacity: 0;
    pointer-events: none;
  }

  /* --- Intermediate groups -------------------------------------------- */

  #storybook-explorer-tree .sidebar-item[data-nodetype='group'] {
    padding-left: var(--al-sb-indent-component);
    font-size: 12.5px;
    color: var(--al-sb-text-idle);
  }

  /* --- Components ------------------------------------------------------ */

  #storybook-explorer-tree .sidebar-item[data-nodetype='component'] {
    padding-left: var(--al-sb-indent-component);
    font-size: 12.5px;
    font-weight: 400;
    color: var(--al-sb-text-idle);
  }

  #storybook-explorer-tree .sidebar-item[data-nodetype='component'][data-selected='true'] {
    background: var(--al-sb-active);
    color: #ffffff;
    font-weight: 600;
  }

  /* --- Stories and docs pages ------------------------------------------ */

  #storybook-explorer-tree .sidebar-item[data-nodetype='story'],
  #storybook-explorer-tree .sidebar-item[data-nodetype='document'] {
    padding-left: var(--al-sb-indent-story);
    font-size: 12px;
    font-weight: 400;
    color: var(--al-sb-text-muted);
  }

  #storybook-explorer-tree .sidebar-item[data-nodetype='story'][data-selected='true'],
  #storybook-explorer-tree .sidebar-item[data-nodetype='document'][data-selected='true'] {
    background: var(--al-sb-active-child);
    color: #ffffff;
    font-weight: 600;
  }

  /* --- Hover ----------------------------------------------------------- */

  #storybook-explorer-tree .sidebar-item[data-highlightable='true']:hover {
    background: var(--al-sb-control);
    color: var(--al-sb-text-strong);
  }

  #storybook-explorer-tree .sidebar-item[data-nodetype='root']:hover {
    background: transparent;
    color: var(--al-sb-text-muted);
  }

  /* ---------------------------------------------------------------------
     5. Count badge
     Injected by `sidebar.renderLabel` in manager.js as `.al-count`, because
     the story index is only reachable from the manager API, not from CSS.
     --------------------------------------------------------------------- */

  #storybook-explorer-tree .al-label {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
  }

  #storybook-explorer-tree .al-label > span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #storybook-explorer-tree .al-count {
    margin-left: auto;
    flex: none;
    font-family: var(--al-sb-mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--al-sb-text-muted);
  }

  /* Atomic-level badge (Atom / Molecule / Organism), driven by story tags. */
  #storybook-explorer-tree .al-level {
    flex: none;
    font-family: var(--al-sb-mono);
    font-size: 9.5px;
    line-height: 1;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--al-sb-text-muted);
    border: 1px solid var(--al-sb-border-strong);
    border-radius: 3px;
    padding: 2px 4px;
    opacity: 0.75;
  }

  /* ---------------------------------------------------------------------
     6. Sidebar footer note
     The container is a flex column, so this becomes the last flex item and
     pins itself below the scrolling tree.
     --------------------------------------------------------------------- */

  /* Storybook already sets `position: absolute` on this pseudo-element, and its
     rule wins (this file is injected before Emotion's styles). So rather than
     fight it with flex ordering — which silently placed the note at the top,
     over the logo — it is pinned to the bottom explicitly. */
  #storybook-sidebar-region::after {
    content: 'Presets are token sets, not skins. Same components, same API.';
    position: absolute;
    /* `top: auto` is load-bearing. Storybook's own rule for this pseudo-element
       sets `top: 0`; adding `bottom: 0` without resetting it stretched the note
       to full height, turning it into an opaque overlay that painted over the
       entire tree. */
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    height: auto;
    z-index: 2;
    padding: 12px 16px;
    border-top: 1px solid var(--al-sb-border);
    background: var(--al-sb-panel);
    font-family: var(--al-sb-font);
    font-size: 11px;
    line-height: 1.5;
    color: var(--al-sb-text-muted);
  }

  /* Reserve room so the last tree rows can scroll clear of the pinned note. */
  #storybook-explorer-tree {
    padding-bottom: 64px;
  }

  /* ---------------------------------------------------------------------
     7. Toolbar
     --------------------------------------------------------------------- */

  .sb-bar {
    background: var(--al-sb-panel);
    border-bottom: 1px solid var(--al-sb-border);
    font-family: var(--al-sb-font);
  }

  #storybook-panel-root .sb-bar,
  [data-testid='sb-preview-toolbar'].sb-bar {
    height: 48px;
  }

  /* ---------------------------------------------------------------------
     8. Bottom dock
     --------------------------------------------------------------------- */

  #storybook-panel-root {
    background: var(--al-sb-panel);
    border-top: 1px solid var(--al-sb-border);
    font-family: var(--al-sb-font);
  }

  /* ---------------------------------------------------------------------
     9. Canvas gutter
     --------------------------------------------------------------------- */

  #storybook-preview-wrapper {
    background: var(--al-sb-canvas);
  }

  /* ---------------------------------------------------------------------
     10. Scrollbars
     --------------------------------------------------------------------- */

  #storybook-explorer-menu ::-webkit-scrollbar,
  #storybook-explorer-tree::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  #storybook-explorer-menu ::-webkit-scrollbar-thumb,
  #storybook-explorer-tree::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, 0.35);
    border-radius: 4px;
  }
</style>
