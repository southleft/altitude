<!--
  Altitude — docs page (preview iframe) styling.

  This is the PREVIEW head, not the manager head. Docs pages render inside the
  story iframe, so their CSS has to live here; `manager-head.html` cannot reach
  them.

  Colours deliberately resolve to Altitude's own design tokens (`--al-theme-*`,
  injected by `main.scss` in preview.ts) rather than hardcoded hexes. That means
  the docs chrome follows the design system, and will follow a selected preset
  for free once the preset switcher lands — the docs page re-themes with the
  components instead of drifting from them. Fallbacks keep it legible if a token
  is ever missing.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>

<style id="al-docs-reskin">
  /* Declared on :root, not `.sbdocs`, on purpose.
     `styles/docs.scss` consumes `--al-docs-line` from inside the token panels'
     shadow roots. On a docs page those inherit it via `.sbdocs`, but in plain
     story view `.sbdocs` is not an ancestor and they would silently fall back
     to their literal default — so the two views could drift apart if this value
     ever changed. Defining it at the document root keeps one source of truth. */
  :root {
    /* WHY THESE ARE LITERALS, NOT `--al-theme-*` TOKENS
       An earlier revision mapped these onto the product token scale. It was
       wrong on two counts:

       1. `--al-theme-color-border-default` resolves to `#8a8a8a` in the dark
          theme — it is a CONTENT border (inputs, dividers), sized to be clearly
          visible. Used as card chrome it drew a near-white box around every
          block on the page.
       2. The surface scale runs the other way from what card chrome needs:
          `background-default-weak` is DARKER (#101010) and `-strong` is LIGHTER
          (#2e2e2e), so "raised" and "sunken" came out inverted — card bodies
          sank and header bars lifted.

       The scale has no subtle step for chrome anyway: below `#8a8a8a` the next
       border stop is `#616161`, still far too strong for a hairline. So the
       docs chrome uses the same fixed shell palette as the manager (theme.js),
       which is what the reference design uses for tool chrome. When a proper
       surface/line scale exists, these five vars are the only things to
       repoint. */
    --al-docs-surface: #141416;
    --al-docs-raised: #1c1c1f;
    --al-docs-sunken: #151517;
    --al-docs-line: #262629;

    --al-docs-ink: #ededf0;
    --al-docs-ink-2: #b6b6be;
    --al-docs-ink-3: #8a8a92;
    --al-docs-radius: 10px;

    --al-docs-font: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    --al-docs-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    /* Story-card label treatment. In the reference design these are two of the
       seven themed axes (`--al-cs-lb` / `--al-tr-lb`) — some presets set card
       labels uppercase and tracked, others leave them sentence case. They are
       declared as custom properties here so a preset can flip the whole library
       without touching this stylesheet. */
    --al-docs-label-transform: uppercase;
    --al-docs-label-tracking: 0.06em;
  }

  /* ---------------------------------------------------------------------
     Page frame
     --------------------------------------------------------------------- */

  .sbdocs.sbdocs-wrapper {
    padding: 0;
    background: var(--al-docs-sunken);
  }

  /* The page frame (max-width + padding) is defined ONCE, on `.sbdocs-content`
     in the MDX section below, so component pages and MDX pages share it. Adding
     padding here too would double it to 64px on component pages. */
  .sbdocs .al-docs {
    font-family: var(--al-docs-font);
    color: var(--al-docs-ink);
  }

  /* ---------------------------------------------------------------------
     Page header — breadcrumb / badge / title / description / story count
     --------------------------------------------------------------------- */

  .al-docs__header {
    padding-bottom: 20px;
    border-bottom: 1px solid var(--al-docs-line);
    margin-bottom: 18px;
  }

  .al-docs__eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .al-docs__crumb {
    font-family: var(--al-docs-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--al-docs-ink-3);
  }

  .al-docs__level {
    font-family: var(--al-docs-mono);
    font-size: 11px;
    color: var(--al-docs-ink-3);
    border: 1px solid var(--al-docs-line);
    border-radius: 4px;
    padding: 1px 6px;
  }

  .sbdocs .al-docs__title {
    margin: 0 0 10px;
    font-family: var(--al-docs-font);
    font-size: 38px;
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--al-docs-ink);
    border: none;
    padding: 0;
  }

  .sbdocs .al-docs__description {
    margin: 0;
    font-size: 15px;
    line-height: 1.55;
    color: var(--al-docs-ink-2);
    max-width: 640px;
    text-wrap: pretty;
  }

  .al-docs__count {
    margin-top: 14px;
    font-family: var(--al-docs-mono);
    font-size: 11px;
    color: var(--al-docs-ink-3);
  }

  /* ---------------------------------------------------------------------
     Story cards
     --------------------------------------------------------------------- */

  .al-docs__stories {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .al-docs__card {
    border: 1px solid var(--al-docs-line);
    border-radius: var(--al-docs-radius);
    background: var(--al-docs-raised);
    overflow: hidden;
  }

  .al-docs__card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 16px;
    border-bottom: 1px solid var(--al-docs-line);
    background: var(--al-docs-sunken);
  }

  .al-docs__card-name {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: var(--al-docs-label-tracking);
    text-transform: var(--al-docs-label-transform);
    color: var(--al-docs-ink);
  }

  .al-docs__card-id {
    font-family: var(--al-docs-mono);
    font-size: 11px;
    color: var(--al-docs-ink-3);
    white-space: nowrap;
  }

  /* Story description, when the story has one. */
  .al-docs__card-note {
    padding: 12px 16px 0;
    font-size: 13px;
    line-height: 1.55;
    color: var(--al-docs-ink-2);
  }

  /* ---------------------------------------------------------------------
     Storybook's Canvas inside our card.

     Canvas renders two SIBLINGS: `.sbdocs-preview` (the story) and
     `.sbdocs-preview-actions` (Show code / Copy code). The card supplies the
     outer frame, so the preview must not draw a second border — but it DOES
     still need its own padding, otherwise the story collapses flush against
     the actions bar and the two visually overlap.
     --------------------------------------------------------------------- */

  .al-docs__card .sbdocs-preview,
  .al-docs__card .docblock-preview {
    margin: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

  .al-docs__card .docs-story {
    padding: 22px 16px;
    background: transparent;
  }

  /* Turn the code affordances into a card footer rather than hiding them —
     this is where "show the source" lives now that the page has no other home
     for it. */
  /* `margin: -40px 0 40px` is Storybook's own rule — it deliberately pulls the
     actions bar UP to overlap the bottom of the preview, and pads below. In a
     bordered card that reads as the story colliding with "Show code", plus a
     dead 40px band under it. Reset to a normal stacked footer. */
  .al-docs__card .sbdocs-preview-actions {
    margin: 0;
    padding: 4px 10px;
    border-top: 1px solid var(--al-docs-line);
    background: var(--al-docs-sunken);
  }

  .al-docs__card .docblock-code-toggle {
    color: var(--al-docs-ink-3);
  }

  /* =====================================================================
     MDX PAGES
     =====================================================================
     Attached MDX (`<Meta of={Stories} />`) replaces the autodocs page
     outright — Storybook overwrites `docs.page` for those entries — so the
     React template above never runs for Foundations/Tokens, Icons or
     Utilities. These rules give those pages the same presentation without
     touching their authored content.

     Their DOM is flat: h1, p, hr, then a run of `.sbdocs-preview` blocks.
     The headings and tables you see are rendered *inside* the story
     components, so they are intentionally left alone.
     --------------------------------------------------------------------- */

  .sbdocs-content {
    max-width: 1180px;
    padding: 32px;
    font-family: var(--al-docs-font);
  }

  /* Match the display treatment of `.al-docs__title`. Scoped to `.sbdocs h1`
     (0,1,1) so the template's `.sbdocs .al-docs__title` (0,2,0) still wins. */
  .sbdocs-content > h1 {
    font-family: var(--al-docs-font);
    font-size: 38px;
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--al-docs-ink);
    border-bottom: none;
    margin: 0 0 10px;
    padding: 0;
  }

  .sbdocs-content > p {
    font-size: 15px;
    line-height: 1.55;
    color: var(--al-docs-ink-2);
    max-width: 640px;
    text-wrap: pretty;
    margin: 0 0 18px;
  }

  .sbdocs-content > hr {
    border: none;
    border-top: 1px solid var(--al-docs-line);
    margin: 20px 0 18px;
  }

  /* Every Canvas on an MDX page becomes a card, matching the story cards on
     component pages. These use `sourceState="none"`, so there is no action bar
     to reconcile — the card is just frame plus body. */
  .sbdocs-content > .sbdocs-preview {
    border: 1px solid var(--al-docs-line);
    border-radius: var(--al-docs-radius);
    background: var(--al-docs-raised);
    box-shadow: none;
    overflow: hidden;
    margin: 0 0 16px;
  }

  .sbdocs-content > .sbdocs-preview .docs-story {
    padding: 22px 16px;
    background: transparent;
  }

  /* ---------------------------------------------------------------------
     Args table
     --------------------------------------------------------------------- */

  .al-docs__args {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--al-docs-line);
  }

  .al-docs__section-label {
    font-family: var(--al-docs-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--al-docs-ink-3);
    margin-bottom: 14px;
  }
</style>
