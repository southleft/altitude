<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Altitude story fixture</title>
    <!--
      REGISTRY FLAG, INLINE AND FIRST — load-bearing, not a convenience.

      Composites read `window.alAutoRegistry` at MODULE-EVAL time to choose the
      tag they render their sub-components under. ESM imports hoist, so setting
      this from application JS runs too late and a composite silently renders
      unregistered children. See .altitude/REGISTRATION.md.
    -->
    <script>
      window.alAutoRegistry = true;
    </script>
    <link rel="stylesheet" href="../styles/main.scss" />
    <!--
      THE DESIGN SYSTEM'S OWN TOKEN BUNDLE. `main.scss` carries the reset, the
      cascade layers, the base element styles, the utilities and a `:root` that
      is DARK (`./dist/scss/theme/tokens-dark.scss`). It carries no
      `[data-al-mode]` blocks at all, so with this file missing `<al-theme
      mode="light">` had nothing to match: the host got `data-al-mode="light"`
      and no rule ever selected it. The Foundations/Theme story rendered dark
      while asking for light, which is what took its VRT baseline red.

      One bundle, not two: each is `:root, [data-al-project='<id>']`, so a
      second one loaded here would win `:root` for every other story. Two
      systems in one document is proven by `pnpm test:brands` and
      `pnpm run brands:compare`, which load them properly scoped.
    -->
    <link rel="stylesheet" href="../styles/dist/css/project/altitude.css" />
  </head>
  <body>
    <!--
      `#storybook-root` keeps its Storybook name deliberately: it is the
      selector `scripts/build-a11y-report.mjs` waits for and scopes axe to.
      Renaming it would break a working consumer to no benefit.
    -->
    <div id="storybook-root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
