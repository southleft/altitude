purpose: 'The linked card behind every listing on the site: an image or a fallback glyph,
  meta, a heading, a clamped excerpt and a footer label. `variant` switches it between the
  article and work treatments rather than forking the component.'
whenToUse:
- You are rendering a grid or a list of destinations (articles, case studies, services) and
  each entry links to a page.
- Entries come from content with uneven copy lengths and the grid still has to look even;
  the excerpt clamp is what holds the rows level.
whenNotToUse:
- text: The card is not a link to anywhere. It is a container for content or controls that
    live in place.
  instead: card
- text: You are showing a single testimonial or pull quote rather than an entry in a list
    of destinations.
  instead: testimonial
dos:
- Give `image-alt` real alternative text when the image carries meaning, and an empty string
  when it is decorative. The component will not guess.
- Set `fallback` for content that may have no image, so a missing asset degrades to a glyph
  rather than to a collapsed box.
donts:
- Do not put an interactive element inside the card. The whole card is already one anchor,
  and a nested control is an axe `nested-interactive` failure.
- Do not rely on the excerpt to carry required information. It is clamped, so its last sentence
  may never be visible.
accessibility:
- The component renders one anchor wrapping the whole card, so the heading becomes the link's
  accessible name. Make headings distinguishable from one another or a link list becomes a
  row of identical entries.
content:
- The heading is the destination's title, not a summary of it. The excerpt is where the summary
  goes.
