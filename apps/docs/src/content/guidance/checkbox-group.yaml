  - path: libs/al-web-components/components/checkbox-group/checkbox-group.ts
    contains: checkboxItems.isRequired
    note: >-
      Required and disabled cascading from the group down to every checkbox in
      it.
  - path: libs/al-web-components/components/checkbox-group/checkbox-group.ts
    contains: al-layout
    note: >-
      The slot documentation sending row arrangement to `al-layout` rather than
      to a prop on this component.
  - path: AGENTS.md
    contains: Arrangement vs. semantics
    note: >-
      The table naming exactly why this group is allowed to exist while the
      arrangement-only wrappers were removed.
